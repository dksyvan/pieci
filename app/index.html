<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Icône carrée pour Google : le favicon affiché à côté du nom de site
         dans les résultats doit être au rapport 1:1, et plus grand que
         48 px. Les navigateurs gardent le SVG ; Google trouve ici de quoi
         ne pas retomber sur l'icône générique. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pièci — la plateforme ivoirienne qui rapproche automatiquement les pièces d'identité trouvées et leurs propriétaires." />
    <meta name="author" content="DIBY Yvan" />
    <meta name="theme-color" content="#0F2A43" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pièci" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Aperçu au partage : WhatsApp, Facebook, LinkedIn. Ces URL doivent être
         absolues — les robots d'aperçu ne résolvent pas les chemins relatifs.
         %VITE_SITE_URL% est remplacé au build par Vite : le jour du changement
         de domaine, seule cette variable bouge. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pièci" />
    <meta property="og:locale" content="fr_CI" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Pièci — Ta pièce retrouvée" />
    <meta
      property="og:description"
      content="Tu trouves une pièce d'identité, tu la déclares. Le propriétaire est prévenu automatiquement. Gratuit, sécurisé, 100 % ivoirien."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pièci — Ta pièce retrouvée" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pièci — Ta pièce retrouvée" />
    <meta
      name="twitter:description"
      content="Tu trouves une pièce d'identité, tu la déclares. Le propriétaire est prévenu automatiquement."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <title>Pièci — Ta pièce retrouvée</title>

    <!-- Invite d'installation, captée avant le bundle.
         Chrome émet « beforeinstallprompt » quand il juge le site
         installable, et une seule fois par chargement. Le bundle est un
         module, exécuté après l'analyse du document : s'il était seul à
         écouter, l'événement pourrait partir avant lui et être perdu. Ce
         script classique s'exécute tout de suite et le garde de côté
         (voir src/lib/installation.ts). preventDefault retire le bandeau
         natif de Chrome : c'est notre bouton qui propose, au moment voulu. -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__PIECI_INSTALL__ = e;
        window.dispatchEvent(new Event('pieci:installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__PIECI_INSTALL__ = null;
        window.dispatchEvent(new Event('pieci:installee'));
      });
    </script>

    <!-- Données structurées de la page d'accueil, en un seul graphe.
         - WebSite porte le NOM DE SITE que Google affiche au-dessus du
           résultat. C'est le mécanisme documenté pour « pieci » : le mot
           est aussi une chaîne de radio lettone et le nombre cinq en
           letton, et Google n'attribue pas le même nom de site à deux sites
           mondiaux. alternateName lui donne les formes qu'on tape vraiment.
         - Organization relie Pièci à ses profils publics (sameAs). Seuls y
           figurent des profils vérifiés comme les nôtres : un sameAs vers le
           compte de quelqu'un d'autre dirait à Google que nous sommes lui.
         - Pas de SearchAction : Google a retiré le champ de recherche des
           résultats le 21 novembre 2024, la balise ne produit plus rien.
         - Plus de WebApplication : Google n'en tire un résultat enrichi
           qu'avec une note ou des avis, et signale le nœud invalide sans
           eux. Des avis inventés sont interdits ; l'identité du site est
           désormais portée par WebSite et Organization. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#site",
            "name": "Pièci",
            "alternateName": ["Pieci", "Pieci CI", "pieci.ci"],
            "url": "%VITE_SITE_URL%/",
            "inLanguage": "fr",
            "publisher": { "@id": "%VITE_SITE_URL%/#organisation" }
          },
          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organisation",
            "name": "Pièci",
            "alternateName": ["Pieci", "Pieci CI", "pieci.ci"],
            "url": "%VITE_SITE_URL%/",
            "logo": "%VITE_SITE_URL%/pwa-512x512.png",
            "areaServed": { "@type": "Country", "name": "Côte d'Ivoire" },
            "sameAs": [
              "https://www.linkedin.com/company/pieci/",
              "https://www.facebook.com/profile.php?id=61594015171211"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

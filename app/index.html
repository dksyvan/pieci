<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pièci — la plateforme ivoirienne qui rapproche automatiquement les pièces d'identité trouvées et leurs propriétaires." />
    <meta name="author" content="DIBY Yvan" />
    <meta name="theme-color" content="#0F2A43" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pièci" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Aperçu au partage : WhatsApp, Facebook, LinkedIn. Ces URL doivent être
         absolues — les robots d'aperçu ne résolvent pas les chemins relatifs.
         %VITE_SITE_URL% est remplacé au build par Vite : le jour du changement
         de domaine, seule cette variable bouge. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pièci" />
    <meta property="og:locale" content="fr_CI" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Pièci — Ta pièce retrouvée" />
    <meta
      property="og:description"
      content="Tu trouves une pièce d'identité, tu la déclares. Le propriétaire est prévenu automatiquement. Gratuit, sécurisé, 100 % ivoirien."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pièci — Ta pièce retrouvée" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pièci — Ta pièce retrouvée" />
    <meta
      name="twitter:description"
      content="Tu trouves une pièce d'identité, tu la déclares. Le propriétaire est prévenu automatiquement."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <title>Pièci — Ta pièce retrouvée</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pièci",
        "url": "%VITE_SITE_URL%/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web",
        "inLanguage": "fr",
        "description": "Pièci rapproche automatiquement les pièces d'identité trouvées et leurs propriétaires en Côte d'Ivoire.",
        "author": {
          "@type": "Person",
          "name": "DIBY Yvan"
        },
        "creator": {
          "@type": "Person",
          "name": "DIBY Yvan"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "XOF"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Côte d'Ivoire"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

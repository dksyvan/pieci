name = "pieci"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# URL de l'API en production. Non secrète : elle est déjà visible dans le
# bundle client. En développement, la valeur de .env la remplace (wrangler dev
# charge ce fichier), ce qui pointe le Worker sur l'API locale.
[vars]
API_URL = "https://pieci.onrender.com"

# Destination du QR WhatsApp (route /wa). Vide tant que le compte n'existe
# pas : le scan mène alors à l'accueil plutôt que nulle part.
#
# Y mettre l'adresse complète le jour venu — un compte WhatsApp Business
# (« https://wa.me/225XXXXXXXXXX ») ou un canal
# (« https://whatsapp.com/channel/XXXX »). Les stickers déjà collés suivront
# sans être réimprimés : c'est toute la raison d'être de cette route.
WHATSAPP_URL = ""

[assets]
directory = "./dist"
binding = "ASSETS"

# Les pages sont pré-rendues en dist/<route>/index.html : Cloudflare les sert
# telles quelles. Le repli SPA ne concerne donc plus que les routes sans
# fichier, comme /suivi.
not_found_handling = "single-page-application"

# Sans ce réglage, Cloudflare redirige /guides vers /guides/ — un saut de plus
# sur chaque lien interne, et une URL différente de celle que déclarent nos
# balises canoniques et le sitemap. On sert la forme sans barre finale, qui est
# celle qu'on publie partout.
html_handling = "drop-trailing-slash"

# Quatre familles de chemins passent par le Worker : les pages du registre, où
# il écrit les comptes vivants ; les fiches /piece/*, dont il compose les
# balises d'aperçu pièce par pièce ; /qr et /wa, les cibles des QR codes
# imprimés, qui redirigent puis comptent ; et /api/*, qu'il relaie vers l'API applicative (voir
# worker/index.js). Tout le reste part du serveur d'assets directement —
# chemin rapide, zéro exécution.
#
# /api/* doit impérativement figurer ici : sans cette ligne, le repli SPA
# répondrait index.html à chaque appel d'API, et le client recevrait du HTML
# là où il attend du JSON.
run_worker_first = ["/trouvees", "/trouvees/*", "/piece/*", "/qr", "/wa", "/api/*"]
